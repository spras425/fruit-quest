<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fruit Quest!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5ffe0;
    }
    h1 {
      color: #4caf50;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(8, 60px);
      grid-template-rows: repeat(8, 60px);
      gap: 5px;
      justify-content: center;
      margin: 20px auto;
    }
    .tile {
      background-color: #c8e6c9;
      border: 2px solid #388e3c;
      width: 60px;
      height: 60px;
      font-size: 10px;
      cursor: pointer;
      position: relative;
    }
    .tile.revealed {
      background-color: #fff9c4;
    }
    .fruit {
      position: absolute;
      bottom: 5px;
      left: 5px;
      font-size: 14px;
    }
    #info {
      margin-top: 20px;
    }
    #nextTurn {
      padding: 10px 20px;
      background-color: #66bb6a;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🍌 Fruit Quest! 🍍</h1>
  <div id="board"></div>
  <div id="info">
    <p>Click tiles to explore. Find fruit, track ripening!</p>
    <button id="nextTurn">Next Turn</button>
    <p id="turnCounter">Turn: 0</p>
  </div>

  <script>
    const board = document.getElementById('board');
    const turnCounter = document.getElementById('turnCounter');
    let turn = 0;

    const fruitTypes = ['🍌', '🥭', '🍇', '🍓', '🍍', '🍈'];
    const ripeningStages = ['green', 'yellow', 'red'];

    const grid = [];

    function createBoard() {
      for (let i = 0; i < 64; i++) {
        const tile = document.createElement('div');
        tile.classList.add('tile');
        tile.dataset.index = i;

        if (Math.random() < 0.25) {
          tile.dataset.fruit = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
          tile.dataset.stage = 0;
        }

        tile.addEventListener('click', () => revealTile(tile));
        board.appendChild(tile);
        grid.push(tile);
      }
    }

    function revealTile(tile) {
      tile.classList.add('revealed');
      if (tile.dataset.fruit) {
        const stage = parseInt(tile.dataset.stage);
        tile.innerHTML = `<div class="fruit">${tile.dataset.fruit} (${ripeningStages[stage]})</div>`;
      } else {
        tile.innerHTML = '🌿';
      }
    }

    function advanceTurn() {
      turn++;
      turnCounter.textContent = "Turn: " + turn;

      grid.forEach(tile => {
        if (tile.dataset.fruit) {
          let stage = parseInt(tile.dataset.stage);
          if (stage < 2) {
            stage++;
            tile.dataset.stage = stage;
          }
          if (tile.classList.contains('revealed')) {
            tile.innerHTML = `<div class="fruit">${tile.dataset.fruit} (${ripeningStages[stage]})</div>`;
          }
        }
      });
    }

    document.getElementById('nextTurn').addEventListener('click', advanceTurn);

    createBoard();
    const agentMemory = {}; // Q-table for tiles
const learningRate = 0.6;
const discountFactor = 0.9;

// Reward system: red = best
const fruitReward = {
  green: 0,
  yellow: 0.2,
  red: 1
};

// Called every time the agent "plays" a turn
function agentTakeTurn() {
  const choices = grid.map((tile, index) => {
    let key = index.toString();
    let q = agentMemory[key] ?? 0;
    return { index, q };
  });

  // Choose best known tile or random (explore)
  choices.sort((a, b) => b.q - a.q);
  const explore = Math.random() < 0.3;
  const chosen = explore ? choices[Math.floor(Math.random() * choices.length)] : choices[0];
  const tile = grid[chosen.index];

  // Simulate agent visiting the tile
  if (!tile.classList.contains('revealed')) {
    revealTile(tile);
  }

  // Learn from result
  if (tile.dataset.fruit) {
    const stage = ripeningStages[parseInt(tile.dataset.stage)];
    const reward = fruitReward[stage];

    // Q-learning update
    const key = chosen.index.toString();
    const oldQ = agentMemory[key] ?? 0;
    const newQ = oldQ + learningRate * (reward - oldQ);
    agentMemory[key] = newQ;
  }

  // Highlight tile as "agent's choice"
  tile.style.border = "3px solid red";
}

  </script>
</body>
</html>
